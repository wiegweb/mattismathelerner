.hero.small{width:min(22vh,40vw,200px)}
.btn{font:inherit;font-size:clamp(20px,3.4vw,30px);color:#fff;background:var(--red);border:4px solid var(--dark);border-radius:22px;padding:14px 26px;box-shadow:0 6px 0 var(--dark);cursor:pointer;margin:8px}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--dark)}
.btn.alt{background:var(--fire);color:var(--dark)}
.btn.gray{background:#fff;color:var(--dark)}
.menu{display:flex;flex-direction:column;align-items:stretch;width:min(560px,100%)}
.menu .btn{text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.pick .btn{min-width:110px}
.back{align-self:flex-start;font-size:20px;padding:8px 16px;margin:0}
.top{width:min(760px,100%);display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:clamp(18px,3vw,26px)}
.pill{background:#fff;border:3px solid var(--dark);border-radius:999px;padding:4px 16px;box-shadow:0 3px 0 var(--dark)}
.bar{width:min(760px,100%);height:26px;background:#fff;border:4px solid var(--dark);border-radius:16px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--gold),var(--fire),var(--red));transform-origin:left;transition:background .2s}
.bonus{position:absolute;font-size:44px;color:var(--ok);font-weight:bold;text-shadow:2px 2px 0 #fff;pointer-events:none;animation:up .9s ease-out forwards}
@keyframes up{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-70px)}}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:min(760px,100%);gap:14px}
.task{font-size:clamp(44px,10vw,96px);color:var(--dark);background:#fff;border:5px solid var(--dark);border-radius:28px;padding:10px 34px;box-shadow:0 8px 0 var(--dark);text-align:center;min-width:60%}
.task.two{font-size:clamp(28px,6.2vw,64px);padding:12px 22px;display:flex;flex-wrap:wrap;gap:8px 26px;justify-content:center;align-items:center}
.sep{color:var(--red)}
.slot{display:inline-block;min-width:1.7em;padding:0 10px;border-bottom:6px solid var(--dark);color:var(--red)}
.slot.act{background:#ffe9a8;border-radius:12px;border-bottom-color:var(--fire)}
.slot.done{color:var(--ok)}
.opts{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.opt{font:inherit;font-size:clamp(34px,7vw,64px);min-width:clamp(110px,22vw,190px);padding:14px 10px;background:var(--gold);color:var(--dark);border:5px solid var(--dark);border-radius:26px;box-shadow:0 8px 0 var(--dark);cursor:pointer}
.opt:active{transform:translateY(6px);box-shadow:0 2px 0 var(--dark)}
.opt.bad{background:var(--bad);color:#fff;opacity:.55}
.opt.good{background:var(--ok);color:#fff}
.shake{animation:sh .35s}
@keyframes sh{20%{transform:translateX(-14px)}40%{transform:translateX(14px)}60%{transform:translateX(-10px)}80%{transform:translateX(10px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(420px,92%)}
.pad button{font:inherit;font-size:clamp(28px,5vw,44px);padding:10px 0;background:#fff;color:var(--dark);border:4px solid var(--dark);border-radius:20px;box-shadow:0 5px 0 var(--dark)}
.pad button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--dark)}
.pad .ok{background:var(--ok);color:#fff}.pad .del{background:var(--fire)}
.solution{font-size:clamp(24px,4.6vw,44px);color:var(--ok);text-align:center;min-height:1.3em}
.big{font-size:clamp(60px,14vw,130px);color:var(--red);text-shadow:4px 4px 0 var(--gold);margin:0}
.stars{font-size:clamp(40px,8vw,70px);letter-spacing:8px}
@media (max-width:900px){.sep{display:none}}
.hint{font-size:18px;opacity:.75;margin-top:4px}
</style></head><body>

<!-- START -->
<div class="screen on" id="s-home">
  <div class="hero"></div>
  <h1>MATTIS<br>MATHELERNER</h1>
  <p class="sub">Werde zum Mathe-Ninja!</p>
  <div class="menu">
    <button class="btn" onclick="showPick()">⏱ Ninja-Blitz<br><small>Gegen die Zeit</small></button>
    <button class="btn alt" onclick="startM2()">🥷 Ninja-Training<br><small>Kleines 1·1 ohne Zeit</small></button>
  </div>
</div>

<!-- ZEITWAHL -->
<div class="screen" id="s-pick">
  <button class="btn gray back" onclick="show('s-home')">◀ Zurück</button>
  <div class="hero small"></div>
  <h1 style="font-size:clamp(30px,6vw,52px)">Wie viel Zeit?</h1>
  <p class="sub">Für jede richtige Antwort gibt es +3 Sekunden!</p>
  <div class="row pick">
    <button class="btn" onclick="startM1(5)">5 s</button>
    <button class="btn" onclick="startM1(10)">10 s</button>
    <button class="btn" onclick="startM1(15)">15 s</button>
  </div>
  <p class="hint" id="best"></p>
</div>

<!-- MODUS 1 -->
<div class="screen" id="s-m1">
  <div class="top"><button class="btn gray back" onclick="stopM1();show('s-home')">✕</button><span class="pill">⏱ <b id="m1t">10.0</b> s</span><span class="pill">⭐ <b id="m1s">0</b></span></div>
  <div class="bar"><i id="m1bar"></i></div>
  <div class="stage">
    <div class="task" id="m1task">3 · 4</div>
    <div class="opts" id="m1opts"></div>
  </div>
</div>

<!-- MODUS 2 -->
<div class="screen" id="s-m2">
  <div class="top"><button class="btn gray back" onclick="show('s-home')">✕</button><span class="pill" id="m2round">Aufgabe 1/10</span><span class="pill" id="m2type">Auswahl</span></div>
  <div class="stage">
    <div class="task two" id="m2task"></div>
    <div class="opts" id="m2opts"></div>
    <div class="pad" id="m2pad" style="display:none"></div>
    <div class="solution" id="m2sol"></div>
    <button class="btn" id="m2next" style="display:none" onclick="m2Next()">Weiter ➜</button>
  </div>
</div>

<!-- ERGEBNIS -->
<div class="screen" id="s-end">
  <div class="hero small"></div>
  <p class="big" id="endbig">0</p>
  <p class="sub" id="endtxt"></p>
  <div class="stars" id="endstars"></div>
  <div class="row"><button class="btn" id="again">Nochmal!</button><button class="btn gray" onclick="show('s-home')">Menü</button></div>
</div>

<script>
const $=id=>document.getElementById(id);
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));if(id==='s-pick')bestTxt()}
function shake(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function bestTxt(){const b=[5,10,15].map(t=>store('mm_best_'+t)).map((v,i)=>v?`${[5,10,15][i]} s: ${v}`:null).filter(Boolean);$('best').textContent=b.length?'Rekorde – '+b.join(' · '):''}
function options(ans,n=3){const s=new Set([ans]);let g=0;while(s.size<n&&g++<200){let d=rnd(1,Math.max(3,Math.ceil(ans*.25)))*(Math.random()<.5?-1:1);if(Math.random()<.4)d=(Math.random()<.5?-1:1)*rnd(1,3);const v=ans+d;if(v>=0)s.add(v)}return [...s].sort(()=>Math.random()-.5)}

/* ===== Modus 1 ===== */
let m1={};
function makeTask(){
  const t=['·','+','−',':'][rnd(0,3)];let a,b,r,txt;
  if(t==='·'){a=rnd(1,10);b=rnd(1,10);r=a*b;txt=`${a} · ${b}`}
  else if(t==='+'){a=rnd(1,20);b=rnd(1,20);r=a+b;txt=`${a} + ${b}`}
  else if(t==='−'){a=rnd(2,30);b=rnd(1,a);r=a-b;txt=`${a} − ${b}`}
  else{b=rnd(1,10);r=rnd(1,10);a=b*r;txt=`${a} : ${b}`}
  return {txt,r}
}
function startM1(sec){
  m1={start:sec,left:sec,score:0,run:true,last:performance.now()};
  show('s-m1');$('m1s').textContent=0;nextM1();
  cancelAnimationFrame(m1.raf);m1.raf=requestAnimationFrame(tickM1)
}
function stopM1(){m1.run=false;cancelAnimationFrame(m1.raf)}
function nextM1(){
  const t=makeTask();m1.cur=t;$('m1task').textContent=t.txt+' = ?';
  const box=$('m1opts');box.innerHTML='';
  options(t.r).forEach(v=>{const b=document.createElement('button');b.className='opt';b.textContent=v;b.onclick=()=>answerM1(b,v);box.appendChild(b)})
}
function answerM1(btn,v){
  if(!m1.run)return;
  if(v===m1.cur.r){
    m1.score++;m1.left+=3;$('m1s').textContent=m1.score;
    const f=document.createElement('div');f.className='bonus';f.textContent='+3 s';
    const r=btn.getBoundingClientRect();f.style.left=(r.left+r.width/2-40)+'px';f.style.top=(r.top-20)+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),900);
    nextM1()
  }else{btn.classList.add('bad');shake($('m1task'));btn.disabled=true}
}
function tickM1(now){
  if(!m1.run)return;
  m1.left-=(now-m1.last)/1000;m1.last=now;
  if(m1.left<=0){m1.left=0;paintM1();endM1();return}
  paintM1();m1.raf=requestAnimationFrame(tickM1)
}
function paintM1(){
  $('m1t').textContent=m1.left.toFixed(1);
  $('m1bar').style.transform=`scaleX(${Math.min(1,m1.left/Math.max(m1.start,m1.left))})`
}
function endM1(){
  m1.run=false;const k='mm_best_'+m1.start;const old=+store(k)||0;const nb=m1.score>old;if(nb)store(k,m1.score);
  $('endbig').textContent=m1.score;
  $('endtxt').textContent=(m1.score?'richtige Antworten!':'Nächstes Mal klappt es!')+(nb&&m1.score?'  🏆 Neuer Rekord!':'');
  $('endstars').textContent=m1.score>=15?'⭐⭐⭐':m1.score>=8?'⭐⭐':m1.score>=3?'⭐':'';
  $('again').onclick=()=>startM1(m1.start);show('s-end')
}

/* ===== Modus 2 : nacheinander & abwechselnd ===== */
const N=10;let m2={};
function startM2(){m2={i:0,err:0,pairs:[]};let last='';
  while(m2.pairs.length<N){const a=rnd(1,10),b=rnd(1,10);const key=a+'x'+b;if(a===b&&Math.random()<.85)continue;if(m2.pairs.some(p=>p[0]===a&&p[1]===b||p[0]===b&&p[1]===a))continue;m2.pairs.push([a,b])}
  show('s-m2');loadM2()}
function loadM2(){
  const [a,b]=m2.pairs[m2.i];m2.a=a;m2.b=b;m2.step=0;m2.r=a*b;m2.mode=m2.i%2===0?'choice':'input';m2.buf='';m2.failed=false;
  $('m2round').textContent=`Aufgabe ${m2.i+1}/${N}`;$('m2type').textContent=m2.mode==='choice'?'🎯 Auswahl':'🔢 Eintippen';
  $('m2sol').textContent='';$('m2next').style.display='none';paintM2()
}
function paintM2(){
  const s=m2.step,{a,b,r}=m2;
  const f=(i)=>{const done=s>i;const txt=done?r:(s===i&&m2.mode==='input'?m2.buf:'');return `<span class="slot ${s===i?'act':''} ${done?'done':''}">${txt||'&nbsp;'}</span>`};
  $('m2task').innerHTML=`<span>${a} · ${b} = ${f(0)}</span><span class="sep">|</span><span>${b} · ${a} = ${f(1)}</span>`;
  const opts=$('m2opts'),pad=$('m2pad');
  if(s>1){opts.style.display='none';pad.style.display='none';return}
  if(m2.mode==='choice'){pad.style.display='none';opts.style.display='flex';opts.innerHTML='';
    options(r).forEach(v=>{const bt=document.createElement('button');bt.className='opt';bt.textContent=v;bt.onclick=()=>m2Answer(v,bt);opts.appendChild(bt)})}
  else{opts.style.display='none';pad.style.display='grid';
    if(!pad.children.length){[1,2,3,4,5,6,7,8,9,'⌫',0,'OK'].forEach(k=>{const bt=document.createElement('button');bt.textContent=k;if(k==='OK')bt.className='ok';if(k==='⌫')bt.className='del';bt.onclick=()=>m2Key(k);pad.appendChild(bt)})}}
}
function m2Key(k){
  if(k==='⌫'){m2.buf=m2.buf.slice(0,-1)}
  else if(k==='OK'){if(m2.buf==='')return;return m2Answer(+m2.buf)}
  else if(m2.buf.length<3){m2.buf+=k}
  paintM2()
}
function m2Answer(v,bt){
  if(v===m2.r){m2.step++;m2.buf='';
    if(m2.step>1){finishRound();return}
    paintM2()}
  else{m2.err++;m2.failed=true;shake($('m2task'));if(bt){bt.classList.add('bad');bt.disabled=true}else{m2.buf='';paintM2()}}
}
function finishRound(){
  paintM2();const {a,b,r}=m2;
  $('m2sol').textContent=`Lösung: ${a}·${b}=${r} | ${b}·${a}=${r}`;
  const nx=$('m2next');nx.textContent=m2.i+1>=N?'Fertig 🏁':'Weiter ➜';nx.style.display='inline-block'
}
function m2Next(){m2.i++;if(m2.i>=N){endM2();return}loadM2()}
function endM2(){
  $('endbig').textContent=`${N-Math.min(N,m2.err)>0?'':''}${m2.err===0?'Perfekt!':m2.err+' Fehler'}`;
  $('endbig').style.fontSize='clamp(40px,9vw,90px)';
  $('endtxt').textContent=`${N} Aufgaben mit Umkehraufgabe geschafft!`;
  $('endstars').textContent=m2.err===0?'⭐⭐⭐':m2.err<=3?'⭐⭐':'⭐';
  $('again').onclick=()=>{$('endbig').style.fontSize='';startM2()};show('s-end')
}
</script></body></html>
